<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante French</title>
  <link rel="stylesheet" href="styles.css">
  
</head>

<body>

<header>
  <h1>Restaurante French</h1>

  <nav>

  <button id="tema" type="button">🌙 Modo oscuro</button>
 
  <button id="menu" type="button">☰ Menú</button>

  <ul id="menu-list">
    <li><a href="#inicio">Inicio</a></li>
    <li><a href="#productos">Productos</a></li>
    <li><a href="#contacto">Contacto</a></li>
  </ul>
</nav>
</header>

<main>

  <section id="inicio">
    <p>Bienvenidos al Restaurante French.</p>
  </section>

  <section id="productos">
    <h2>Productos</h2>
    <p>Conoce nuestro catálogo de productos.</p>

    <ul>
      <li>Café 20 Bs.</li>
      <li>Capuchino 30 Bs.</li>
      <li>Pastel 50 Bs.</li>
    </ul>
  </section>

  <section id="contacto">
  <h2>Contacto</h2>
  <p>Encuentra nuestros medios de contacto.</p>

  <form>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre">

    <label for="correo">Correo:</label>
    <input type="email" id="correo" name="correo">

    <label for="mensaje">Mensaje:</label>
    <textarea id="mensaje" name="mensaje"></textarea>

    <button type="submit">Enviar</button>
  </form>
</section>
</main>

<footer>
  <p>&copy; 2026 examen by Samuel Canedo Caballero"</p>
</footer>
<script src="script.js"></script>
</body>
