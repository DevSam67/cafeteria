<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="styles.css">
  
</head>

<body>

<header>
  <h1>LAVANDERIA BURBUJAS</h1>

  <nav>

  <button id="tema" type="button">🌙 Modo oscuro</button>
 
  <button id="menu" type="button">☰ Menú</button>

  <ul id="menu-list">
    <li><a href="##lavados">Productos</a></li>
    <li><a href="#contacto">Contacto</a></li>
  </ul>
</nav>
</header>

<main class="container">


  <section id="#lavados">
    <h2>Nuestros lavados</h2>
    <p>Conoce nuestro catálogo de lavados.</p>

    <ul>
      <li>Lavado por kilo - Bs 15</li>
      <li>Planchado de camisa - Bs 8</li>
      <li>Lavado de edredon - Bs 35</li>
    </ul>
  </section>

  <section id="contacto">
  <h2>Contacto</h2>
  <p>Encuentra nuestros medios de contacto.</p>

  <form>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre">

    <label for="correo">Correo:</label>
    <input type="email" id="correo" name="correo">

    <label for="mensaje">Mensaje:</label>
    <textarea id="mensaje" name="mensaje"></textarea>

    <button type="submit">Enviar</button>
    <p id="mensaje"></p>

  </form>
</section>
</main>
